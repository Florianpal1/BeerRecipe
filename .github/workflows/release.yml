# Construit l'APK signé à chaque release publiée sur GitHub et le joint à la release.
name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent : impossible de signer l'APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Tests et APK de release
        env:
          BEERRECIPE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BEERRECIPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BEERRECIPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BEERRECIPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BEERRECIPE_VERSION_CODE: ${{ github.run_number }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          chmod +x gradlew
          export BEERRECIPE_VERSION_NAME="${TAG#v}"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Joindre l'APK à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          apk="BeerRecipe-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
